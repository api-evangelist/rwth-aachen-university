---
aid: rwth-aachen-university
name: RWTH Aachen University
description: >-
  RWTH Aachen University (Rheinisch-Westfaelische Technische Hochschule Aachen) is Germany's largest
  technical university and a member of the TU9 alliance of leading German institutes of technology.
  Unusually for a university, its principal programmable surface is genuinely its own engineering
  rather than a vendor contract running under its name: Coscine, the FAIR research data management
  platform built and operated by the IT Center, publishes a 132-path OpenAPI 3.0.1 contract at
  coscine.rwth-aachen.de whose servers[], contact (servicedesk@rwth-aachen.de) and terms all resolve
  to RWTH. Alongside it the University Library operates a live OAI-PMH 2.0 endpoint for RWTH
  Publications, and the IT Center runs a Shibboleth Identity Provider publishing signed SAML 2.0
  metadata plus an OpenID Connect discovery document — an identity federation surface that is
  institution-operated by definition and rarely catalogued. The IT Center also self-hosts GitLab at
  git.rwth-aachen.de, whose REST API is reachable but is GitLab's contract rather than RWTH's. There
  is no central developer portal, no open data portal (data./opendata./api.rwth-aachen.de do not
  resolve), and no institution-authored course catalog or campus-life API. Every surface recorded
  here carries an x-operator; none of them is a vendor contract misattributed to the institution.
