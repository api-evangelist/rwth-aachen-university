- aid: rwth-aachen-university:gitlab
  x-operator: institution
  name: RWTH GitLab REST API (self-hosted)
  description: >-
    The RWTH IT Center self-hosts a GitLab instance at git.rwth-aachen.de used across the university's
    institutes, and it is also where Coscine itself is developed. The GitLab REST API v4 is reachable
    and answers keyless on public project listings (GET /api/v4/projects returned 200 on 2026-08-30);
    /api/v4/version requires a token and returns 401, which is correct behaviour, not a gap.
    OPERATOR NOTE: the instance, the domain, the hardware and the operational responsibility are
    RWTH's, so the surface is recorded as institution-operated. The CONTRACT, however, is GitLab's
    product specification, identical on every self-managed GitLab in the world. GitLab's generic
    OpenAPI is therefore deliberately NOT saved into this repository — doing so would credit RWTH
    with GitLab's engineering, which is precisely the misattribution this pipeline exists to prevent.
    The contract scores against GitLab's own repo; the deployment is recorded here.
  humanURL: https://git.rwth-aachen.de/
  baseURL: https://git.rwth-aachen.de/api/v4
  x-contract-author: GitLab Inc.
  x-contract-saved: false
  tags:
  - Source Control
  - Developer Tools
  - Self-Hosted
  - Research Software
  properties:
  - type: Documentation
    url: https://git.rwth-aachen.de/
  - type: SourceCode
    url: https://git.rwth-aachen.de/coscine
