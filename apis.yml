apis:
- aid: rwth-aachen-university:publications-oai
  name: RWTH Publications OAI-PMH
  description: >-
    RWTH Publications is the institutional repository providing access to the publication output of RWTH
    Aachen University. It exposes metadata via the Open Archives Initiative Protocol for Metadata Harvesting
    (OAI-PMH) at publications.rwth-aachen.de/oai2d, enabling third-party harvesting of bibliographic records.
    The repository is indexed by OpenAIRE and re3data.
  humanURL: https://publications.rwth-aachen.de/
  baseURL: https://publications.rwth-aachen.de/oai2d
  tags:
  - OAI-PMH
  - Repository
  - Metadata
  - Open Access
  - Scholarly
  properties:
