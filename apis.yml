x-coverage:
  state: covered
  reason: covered
  detail: >-
    RWTH Aachen is one of the few universities in this cohort whose headline programmable surface is
    genuinely its own. Coscine — the FAIR research data management platform built and run by the RWTH
    IT Center — serves a live OpenAPI 3.0.1 contract of 132 paths and 240 schemas whose servers[]
    (https://coscine.rwth-aachen.de/coscine), info.contact (servicedesk@rwth-aachen.de) and
    info.termsOfService (about.coscine.de) all resolve to RWTH, so it survives the STEP 1 operator
    test as institution-operated rather than a vendor contract wearing the institution's name. The
    audit found no tenant, vendor, hostless, shared-contract or misbased surfaces in this repo, and
    nothing had to be removed for misattribution. Three further institution-operated surfaces were
    confirmed live in this run and were previously uncatalogued or under-recorded: a working OAI-PMH
    2.0 endpoint for RWTH Publications (five metadata formats), a Shibboleth IdP serving XML-DSig
    signed SAML 2.0 metadata plus an OpenID Connect discovery document, and a self-hosted GitLab whose
    API answers keyless. What RWTH does NOT publish is equally measured: no central developer portal,
    no open data portal (data./opendata./api.rwth-aachen.de do not resolve at all), no
    institution-authored course catalog, timetable or campus-life API, and no LTI, SCIM, Caliper or
    QTI surface despite running Moodle. One pointer was removed as dead.
  evidence:
    - url: https://coscine.rwth-aachen.de/coscine/api/swagger/v2/swagger.json
      status: 200
      note: Live Coscine Web API v2 OpenAPI; 132 paths, 240 schemas, institution-operated
    - url: https://coscine.rwth-aachen.de/coscine/api/v2/organizations
      status: 401
      note: Endpoint live and correctly requiring a JWT bearer token
    - url: https://publications.rwth-aachen.de/oai2d?verb=Identify
      status: 200
      note: OAI-PMH 2.0 confirmed by Identify response, not by link presence
    - url: https://sso.rwth-aachen.de/idp/shibboleth
      status: 200
      note: Signed SAML 2.0 IdP metadata, entityID https://login.rz.rwth-aachen.de/shibboleth
    - url: https://sso.rwth-aachen.de/.well-known/openid-configuration
      status: 200
      note: OpenID Connect discovery document, issuer https://sso.rwth-aachen.de
    - url: https://git.rwth-aachen.de/api/v4/projects?per_page=1
      status: 200
      note: Self-hosted GitLab REST API v4 reachable keyless; contract is GitLab's, not saved
    - url: https://api.datacite.org/providers?query=rwth
      status: 200
      note: DataCite member provider "rwth", ROR https://ror.org/04xfq0f34
    - url: https://www.rwth-aachen.de/.well-known/security.txt
      status: 200
      note: RFC 9116 security.txt, unexpired (Expires 2027-12-31)
    - url: https://hpc.itc.rwth-aachen.de/
      status: 200
      note: Research computing service; documentation only, no allocation API contract
    - url: https://moodle.rwth-aachen.de/
      status: 200
      note: RWTHmoodle live, but no LTI/Caliper contract published — no conformance claimed
    - url: https://data.rwth-aachen.de/
      status: 0
      note: Does not resolve — no open data portal
    - url: https://opendata.rwth-aachen.de/
      status: 0
      note: Does not resolve — no open data portal
    - url: https://api.rwth-aachen.de/
      status: 0
      note: Does not resolve — no central API gateway
    - url: https://oauth.campus.rwth-aachen.de/
      status: 0
      note: Resolves to 134.130.66.33 but resets TLS externally; DEAD pointer, removed from apis[]
